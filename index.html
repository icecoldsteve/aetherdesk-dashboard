<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AETHERDESK // COMMAND CENTER</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #02050a; color: #00f0ff; font-family: 'Share Tech Mono', monospace; overflow: hidden; height: 100vh; position: relative; }
  .bg-grid { position: fixed; inset: 0; background-image: linear-gradient(rgba(0,240,255,0.04) 1px, transparent 1px), linear-gradient(90deg, rgba(0,240,255,0.04) 1px, transparent 1px); background-size: 40px 40px; pointer-events: none; z-index: 0; }
  .bg-glow { position: fixed; inset: 0; background: radial-gradient(ellipse at 20% 30%, rgba(0,240,255,0.08) 0%, transparent 50%), radial-gradient(ellipse at 80% 70%, rgba(255,0,170,0.06) 0%, transparent 50%); pointer-events: none; z-index: 0; }
  .scanline { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(transparent 50%, rgba(0, 240, 255, 0.025) 50%); background-size: 100% 4px; pointer-events: none; z-index: 1000; animation: scan 8s linear infinite; }
  @keyframes scan { 0% { transform: translateY(-100%); } 100% { transform: translateY(100%); } }
  header { text-align: center; padding: 8px; border-bottom: 2px solid #00f0ff; background: rgba(0, 20, 40, 0.85); box-shadow: 0 0 25px #00f0ff; position: relative; z-index: 10; }
  h1 { font-family: 'Orbitron', sans-serif; font-size: 1.8em; letter-spacing: 4px; text-shadow: 0 0 15px #00f0ff; }
  .subtitle { color: #ff00aa; font-size: 0.75em; margin-top: 2px; }
  .main { display: flex; height: calc(100vh - 110px); position: relative; z-index: 5; }
  .grid { flex: 1; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); gap: 8px; padding: 10px 10px 40px 10px; align-content: start; justify-content: center; }
  .right-panel { width: 340px; border-left: 2px solid #00f0ff; background: rgba(0, 12, 25, 0.94); display: flex; flex-direction: column; }
  .pnl-header { padding: 8px; border-bottom: 1px solid #00f0ff; font-family: 'Orbitron', sans-serif; font-size: 0.85em; text-align: center; }
  .pnl-stats { padding: 10px; font-size: 0.8em; border-bottom: 1px solid #00f0ff; }
  .pnl-stats .value { font-size: 1.3em; color: #00ff88; }
  .pnl-stats .delta.up { color: #00ff88; }
  .pnl-stats .delta.down { color: #ff4466; }
  .trades-section { flex: 1; overflow-y: auto; padding: 8px; font-size: 0.7em; }
  .trades-section h4 { margin: 8px 0 4px; color: #ffaa00; }
  .trade { margin-bottom: 4px; padding: 3px 0; border-bottom: 1px solid rgba(0,240,255,0.15); }
  .trade.win { color: #00ff88; }
  .trade.loss { color: #ff4466; }
  .log-panel { width: 300px; border-left: 2px solid #00f0ff; background: rgba(0, 12, 25, 0.94); display: flex; flex-direction: column; }
  .log-header { padding: 8px; border-bottom: 1px solid #00f0ff; font-family: 'Orbitron', sans-serif; font-size: 0.8em; text-align: center; }
  .log-content { flex: 1; overflow-y: auto; padding: 8px; font-size: 0.7em; line-height: 1.4; }
  .log-entry { margin-bottom: 6px; opacity: 0.9; }
  .log-entry .time { color: #ffaa00; }
  .log-entry .bot { color: #00ff88; font-weight: bold; }
  .bot-card { background: linear-gradient(145deg, rgba(0,40,60,0.8), rgba(0,20,35,0.9)); border: 1px solid #00f0ff; border-radius: 8px; padding: 8px; display: flex; flex-direction: column; justify-content: center; position: relative; overflow: hidden; transition: all 0.3s; box-shadow: 0 0 8px rgba(0,240,255,0.2), inset 0 0 20px rgba(0,240,255,0.05); transform: scale(0.8); transform-origin: center; cursor: pointer; }
  .bot-card::before { content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%; background: conic-gradient(from 0deg, transparent, rgba(0,240,255,0.15), transparent 30%); animation: rotate 12s linear infinite; pointer-events: none; }
  @keyframes rotate { 100% { transform: rotate(360deg); } }
  .bot-card:hover { transform: scale(0.8) translateY(-2px); box-shadow: 0 0 18px #00f0ff, inset 0 0 25px rgba(0,240,255,0.1); }
  .bot-card.active { border-color: #00ff88; animation: pulse 2s infinite; }
  @keyframes pulse { 0%, 100% { box-shadow: 0 0 8px #00ff88, inset 0 0 15px rgba(0,255,136,0.1); } 50% { box-shadow: 0 0 22px #00ff88, inset 0 0 25px rgba(0,255,136,0.2); } }
  .bot-name { font-family: 'Orbitron', sans-serif; font-size: 0.95em; margin-bottom: 1px; position: relative; z-index: 1; text-shadow: 0 0 8px #00f0ff; }
  .status { font-size: 0.6em; padding: 1px 4px; border-radius: 3px; display: inline-block; margin-top: 2px; position: relative; z-index: 1; }
  .status.running { background: #00ff88; color: #000; }
  .status.idle { background: #444; color: #aaa; }
  .xp-bar { height: 4px; background: #111; border-radius: 3px; margin: 4px 0; overflow: hidden; position: relative; z-index: 1; }
  .xp-fill { height: 100%; background: linear-gradient(90deg, #00f0ff, #ff00aa); transition: width 1s; }
  .level { color: #ffaa00; font-size: 0.65em; position: relative; z-index: 1; }
  .footer { position: fixed; bottom: 0; width: 100%; text-align: center; padding: 4px; background: rgba(0,0,0,0.85); font-size: 0.6em; color: #555; z-index: 10; }
  button { background: transparent; border: 1px solid #00f0ff; color: #00f0ff; padding: 5px 10px; margin: 3px; font-family: 'Orbitron', sans-serif; cursor: pointer; transition: all 0.2s; font-size: 0.7em; }
  button:hover { background: #00f0ff; color: #000; box-shadow: 0 0 10px #00f0ff; }
</style>
</head>
<body>
<div class="bg-grid"></div>
<div class="bg-glow"></div>
<div class="scanline"></div>
<header>
  <h1>AETHERDESK</h1>
  <div class="subtitle">MULTI-AGENT COMMAND CENTER // PAPER MODE ACTIVE</div>
  <button onclick="enableAudio()">ACTIVATE SOUND</button>
  <button onclick="document.getElementById('log').scrollTop = document.getElementById('log').scrollHeight">SCROLL TO BOTTOM</button>
</header>
<div class="main">
  <div class="grid" id="grid"></div>
  <div class="right-panel">
    <div class="pnl-header">PAPER TRADING DESK</div>
    <div class="pnl-stats">
      <div>Starting Stack: <span class="value" id="start">$10,000</span></div>
      <div>Current Equity: <span class="value" id="equity">$10,000</span></div>
      <div>Progress: <span class="delta" id="delta">$0</span></div>
    </div>
    <div class="trades-section">
      <h4>WINNING TRADES</h4>
      <div id="wins"></div>
      <h4>LOSING TRADES</h4>
      <div id="losses"></div>
    </div>
  </div>
  <div class="log-panel">
    <div class="log-header">LIVE ACTIVITY LOG</div>
    <div class="log-content" id="log"></div>
  </div>
</div>
<div class="footer">REAL-TIME STATUS // GAMIFIED // SCI-FI INTERFACE // NO REAL CAPITAL AT RISK // LIVE PAPER DATA</div>
<script>
let audioCtx;
function enableAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  playBotSound(0);
}

const bots = [
  {name: "Pulse Scout", role: "Discovery", status: "running", level: 12, xp: 78, freq: 520, type: 'sine', dur: 0.18},
  {name: "Forge Filter", role: "Risk Gate", status: "running", level: 15, xp: 45, freq: 180, type: 'sawtooth', dur: 0.25},
  {name: "Echo Sentinel", role: "News Radar", status: "idle", level: 9, xp: 62, freq: 880, type: 'square', dur: 0.12},
  {name: "Thesis Weaver", role: "Analysis", status: "idle", level: 11, xp: 33, freq: 440, type: 'triangle', dur: 0.3},
  {name: "Atlas Chart", role: "Technicals", status: "idle", level: 7, xp: 90, freq: 660, type: 'sine', dur: 0.15},
  {name: "Aegis Risk", role: "Capital Shield", status: "idle", level: 14, xp: 55, freq: 220, type: 'square', dur: 0.22},
  {name: "Gatekeeper", role: "Final Gate", status: "idle", level: 16, xp: 20, freq: 330, type: 'sawtooth', dur: 0.28},
  {name: "Afterglow", role: "Post-Trade", status: "idle", level: 8, xp: 70, freq: 740, type: 'triangle', dur: 0.2},
  {name: "Vector", role: "Execution", status: "idle", level: 3, xp: 10, freq: 980, type: 'square', dur: 0.1}
];

const TRADES_URL = 'https://raw.githubusercontent.com/icecoldsteve/aetherdesk-dashboard/main/paper_trades.json';
let startingStack = 10000;
let currentEquity = 10000;
let trades = [];

function updatePnL() {
  document.getElementById('start').textContent = '$' + startingStack.toLocaleString();
  document.getElementById('equity').textContent = '$' + currentEquity.toLocaleString();
  const delta = currentEquity - startingStack;
  const deltaEl = document.getElementById('delta');
  deltaEl.textContent = (delta >= 0 ? '+' : '') + '$' + delta.toLocaleString();
  deltaEl.className = 'delta ' + (delta >= 0 ? 'up' : 'down');

  const wins = trades.filter(t => t.pnl > 0);
  const losses = trades.filter(t => t.pnl < 0);

  document.getElementById('wins').innerHTML = wins.slice(-10).reverse().map(t =>
    `<div class="trade win">${t.token || 'UNKNOWN'} +$${Math.round(t.pnl).toLocaleString()}</div>`
  ).join('') || '<div style="opacity:0.5">No wins yet</div>';

  document.getElementById('losses').innerHTML = losses.slice(-10).reverse().map(t =>
    `<div class="trade loss">${t.token || 'UNKNOWN'} -$${Math.abs(Math.round(t.pnl)).toLocaleString()}</div>`
  ).join('') || '<div style="opacity:0.5">No losses yet</div>';
}

async function loadTrades() {
  try {
    const res = await fetch(TRADES_URL + '?t=' + Date.now());
    if (!res.ok) throw new Error('fetch failed');
    const data = await res.json();
    startingStack = data.startingStack || 10000;
    trades = Array.isArray(data.trades) ? data.trades : [];
    currentEquity = trades.reduce((sum, t) => sum + (Number(t.pnl) || 0), startingStack);
    updatePnL();
    if (trades.length > 0) {
      addLog("System", `loaded ${trades.length} real paper trades — equity $${currentEquity.toLocaleString()}`);
    }
  } catch (e) {
    console.warn('Could not load real trades:', e);
    addLog("System", "waiting for real paper trades data…");
  }
}

function playBotSound(index) {
  if (!audioCtx) return;
  const b = bots[index];
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.type = b.type;
  osc.frequency.setValueAtTime(b.freq, audioCtx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(b.freq * 0.4, audioCtx.currentTime + b.dur);
  gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + b.dur);
  osc.start();
  osc.stop(audioCtx.currentTime + b.dur);
}

const logEl = document.getElementById('log');
const actions = [
  "scanning DexScreener for new Solana pairs",
  "applied hard filters and rug checks",
  "monitoring X for high-impact news",
  "calculating technical score (RSI/MACD/EMAs)",
  "building structured thesis",
  "enforcing position size and stop rules",
  "running final consensus check",
  "reviewing closed paper trade",
  "preparing Jupiter quote (paper mode)",
  "wrote latest verdict to shared status file",
  "rejected candidate — concentration too high",
  "flagged adverse news overlay",
  "cooldown active after previous stop"
];

function addLog(botName, action) {
  const now = new Date();
  const time = now.toLocaleTimeString('en-GB', {hour12: false});
  const entry = document.createElement('div');
  entry.className = 'log-entry';
  entry.innerHTML = `<span class="time">[${time}]</span> <span class="bot">${botName}</span> → ${action}`;
  logEl.appendChild(entry);
  if (logEl.children.length > 120) logEl.removeChild(logEl.firstChild);
  logEl.scrollTop = logEl.scrollHeight;
}

function render() {
  const grid = document.getElementById('grid');
  grid.innerHTML = bots.map((b, i) => `
    <div class="bot-card ${b.status === 'running' ? 'active' : ''}" onclick="playBotSound(${i})">
      <div class="bot-name">${b.name}</div>
      <div style="font-size:0.7em; opacity:0.85;">${b.role}</div>
      <div class="status ${b.status}">${b.status.toUpperCase()}</div>
      <div class="level">LEVEL ${b.level}</div>
      <div class="xp-bar"><div class="xp-fill" style="width:${b.xp}%"></div></div>
      <div style="font-size:0.6em; opacity:0.7;">XP ${b.xp}%</div>
    </div>
  `).join('');
}

function randomizeStatus() {
  bots.forEach((b, i) => {
    if (Math.random() > 0.75) {
      b.status = b.status === 'running' ? 'idle' : 'running';
      const action = actions[Math.floor(Math.random() * actions.length)];
      addLog(b.name, action);
      if (Math.random() > 0.5) playBotSound(i);
    }
    b.xp = Math.min(100, b.xp + Math.floor(Math.random() * 8));
    if (b.xp >= 100) { b.level++; b.xp = 0; }
  });
  render();
}

addLog("System", "AetherDesk online — paper mode active — $10,000 virtual stack — LIVE DATA");
addLog("Pulse Scout", "scanning for new Solana candidates");
addLog("Forge Filter", "shared status file ready");
updatePnL();
render();
loadTrades();
setInterval(loadTrades, 8000);
setInterval(randomizeStatus, 4500);
</script>
</body>
</html>
